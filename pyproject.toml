[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asn1-web-decoder"
version = "3.0.0"
description = "Decodificador web profesional de ASN.1/TLV para CDRs de telecomunicaciones"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Alexander Alonso Fuentes", email = "yoany.fuentes@etecsa.cu"}
]
dependencies = [
    "flask>=2.3.0",
    "flask-login>=0.6.0",
    "python-dotenv>=1.0.0",
    "pyasn1>=0.5.0",
    "asn1tools>=0.160.0",
    "werkzeug>=2.3.0",
    "gunicorn>=21.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[project.scripts]
asn1-decoder = "asn1_decoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
